<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>titre de votre onglet</title>
    <link rel="icon" type="image/png" href="png/folder.png"/>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://use.typekit.net/jed3ash.css">
    <link rel="stylesheet" href="https://use.typekit.net/vob7ttw.css">
</head>

<body>
<div class="container">
    <div class="march-mars">
        <span>★</span>
        <h1>march-mars</h1> 
        <span>★</span>    </div>
    <!-- caché au départ -->
    <div class="toolbar">
        <button id="back" class="hidden">
            ← Retour
        </button>

        <!-- fil d'ariane -->
        <span id="breadcrumb"></span>
    </div>
    <!-- pour afficher les dossiers et les images -->
    <div id="gallery"></div>
</div>

<div id="preview" class="preview hidden">
    <div class="preview-content">
        <button id="prevImage" class="nav prev">←</button>

        <img id="previewImage" src="" alt="">

        <button id="nextImage" class="nav next">→</button>
    </div>
</div>

<script src="./script.js"></script>
</body>
</html>
